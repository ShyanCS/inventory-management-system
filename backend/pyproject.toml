[project]
name = "inventory-backend"
version = "1.0.0"
description = "FastAPI backend for the Inventory & Order Management System"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses function calls in defaults by design
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Alembic env.py inserts sys.path before importing app modules by design
"alembic/env.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
